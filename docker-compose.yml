# Docker Compose — Quantis Stock (Développement)
# Usage : docker compose up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: quantis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantis_stock
      POSTGRES_USER: quantis_user
      POSTGRES_PASSWORD: quantis_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantis_user -d quantis_stock"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quantis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quantis.tech
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
