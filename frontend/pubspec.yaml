name: quantis_stock
description: "Quantis Stock — Gestion de Stock (Desktop & Mobile)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP & API
  dio: ^5.8.0

  # Local database (offline) — Phase 10
  # drift: ^2.25.0
  # sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Auth & secure storage
  flutter_secure_storage: ^9.2.4

  # UI enhancements
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Connectivity
  connectivity_plus: ^6.1.4

  # UUID for offline sync
  uuid: ^4.5.1

  # JSON serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
