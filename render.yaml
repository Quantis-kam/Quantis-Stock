# Blueprint Render — Déploiement Quantis Stock API (Plan Free 0 FCFA)
services:
  - type: web
    name: quantis-stock-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@quantisbf.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: QUANTIS_AI_PROVIDER
        value: gemini
      - key: QUANTIS_AI_API_KEY
        sync: false

