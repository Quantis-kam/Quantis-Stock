# ============================================
# Profil DEV — H2 en mémoire (zéro configuration)
# ============================================
# Pour utiliser PostgreSQL en dev, activer le profil 'dev-pg' :
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev-pg

spring:
  datasource:
    url: jdbc:h2:file:./data/quantis-dev;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

# Logging
logging:
  level:
    com.quantis.stock: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
