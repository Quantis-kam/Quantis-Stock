# ============================================
# Quantis Stock API — Configuration principale
# ============================================

spring:
  application:
    name: quantis-stock-api

  # Profil actif (dev par défaut)
  profiles:
    active: dev

  # JPA / Hibernate
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false

# API versioning
server:
  port: 8080
  servlet:
    context-path: /api/v1

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Application custom properties
app:
  jwt:
    secret: ${JWT_SECRET:quantis-stock-dev-secret-key-change-in-production-2026}
    access-token-expiration-ms: 900000    # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 jours
  default-tva: 18
  devise: FCFA
  pagination:
    default-page-size: 20
    max-page-size: 100

# ============================================
# Quantis AI — Assistant Intelligent
# ============================================
quantis:
  ai:
    enabled: true
    provider: ${QUANTIS_AI_PROVIDER:ollama}
    api-key: ${QUANTIS_AI_API_KEY:}
    model: ${QUANTIS_AI_MODEL:gemini-2.0-flash}
    ollama-host: ${QUANTIS_AI_OLLAMA_HOST:http://localhost:11434}
    ollama-model: ${QUANTIS_AI_OLLAMA_MODEL:qwen3:8b}
    temperature: 0.3
    max-tokens: 4096
    max-history-messages: 20
    timeout-seconds: 60
    confirm-destructive-actions: true
    assistant-name: Quantis
